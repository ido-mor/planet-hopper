<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-title" content="Planet Hopper">
  <title>Planet Hopper</title>
  <meta name="description" content="A pixel-art math rocket game. Answer to fly your ship ten steps to the next planet — add, subtract, round, multiply and divide across endless levels.">

  <!-- Link previews. og:image and og:url have to be absolute: relative URLs
       fail in most scrapers. This is the one carve-out to the "no absolute
       GitHub Pages URLs" rule in AGENTS.md, which covers asset hrefs the page
       itself loads - these are metadata for third-party crawlers. -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ido-mor.github.io/planet-hopper/">
  <meta property="og:title" content="Planet Hopper">
  <meta property="og:description" content="A pixel-art math rocket game. Answer to fly your ship ten steps to the next planet.">
  <meta property="og:image" content="https://ido-mor.github.io/planet-hopper/assets/og-card.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Planet Hopper">
  <meta name="twitter:description" content="A pixel-art math rocket game. Answer to fly your ship ten steps to the next planet.">
  <meta name="twitter:image" content="https://ido-mor.github.io/planet-hopper/assets/og-card.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">

  <!-- iOS launch images. Without these a Home Screen launch flashes blank:
       iOS does not use the manifest's background_color the way Android does.
       Landscape-only, matching the app. Generated by tools/make-startup-images.py;
       deliberately NOT in the service worker precache - iOS caches them itself
       at install and the page never loads them. -->
  <link rel="apple-touch-startup-image" href="assets/startup/1136x640@2x.png"
        media="screen and (device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)">
  <link rel="apple-touch-startup-image" href="assets/startup/1334x750@2x.png"
        media="screen and (device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)">
  <link rel="apple-touch-startup-image" href="assets/startup/2208x1242@3x.png"
        media="screen and (device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: landscape)">
  <link rel="apple-touch-startup-image" href="assets/startup/2436x1125@3x.png"
        media="screen and (device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: landscape)">
  <link rel="apple-touch-startup-image" href="assets/startup/1792x828@2x.png"
        media="screen and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)">
  <link rel="apple-touch-startup-image" href="assets/startup/2688x1242@3x.png"
        media="screen and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: landscape)">
  <link rel="apple-touch-startup-image" href="assets/startup/2532x1170@3x.png"
        media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: landscape)">
  <link rel="apple-touch-startup-image" href="assets/startup/2556x1179@3x.png"
        media="screen and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: landscape)">
  <link rel="apple-touch-startup-image" href="assets/startup/2778x1284@3x.png"
        media="screen and (device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: landscape)">
  <link rel="apple-touch-startup-image" href="assets/startup/2796x1290@3x.png"
        media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: landscape)">
  <!-- UI font is self-hosted (see @font-face in styles.css) so it survives
       offline and costs no third-party round trip on the critical path.
       crossorigin is required on font preloads even for same-origin files. -->
  <link rel="preload" href="fonts/PressStart2P-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- preload="none": the loop is the single largest asset, so it must not
       download behind the "Tap to load game." screen. The first tap plays it,
       and that gesture is what lets iOS start the fetch. -->
  <audio id="startSoundtrack" src="sounds/Hero Immortal.mp3" loop preload="none" playsinline></audio>
  <div class="rotate-device-overlay" id="rotateDeviceOverlay" role="alert">
    <div class="rotate-inner">
      <img class="rotate-mascot" src="assets/icons/icon-192.png" alt="" width="76" height="76">
      <div class="rotate-phone" aria-hidden="true"></div>
      <p>Rotate your phone to landscape to play.</p>
    </div>
  </div>
  <div class="game-container">
    <!-- Left panel: path map (~20%) -->
    <aside class="map-panel">
      <div class="path-diagram">
        <div class="planet target-planet" id="targetPlanet" aria-hidden="true"></div>
        <div class="path-steps">
          <div class="path-step" data-step="9"></div>
          <div class="path-step" data-step="8"></div>
          <div class="path-step" data-step="7"></div>
          <div class="path-step" data-step="6"></div>
          <div class="path-step" data-step="5"></div>
          <div class="path-step" data-step="4"></div>
          <div class="path-step" data-step="3"></div>
          <div class="path-step" data-step="2"></div>
          <div class="path-step" data-step="1"></div>
          <div class="path-step" data-step="0"></div>
        </div>
        <div class="ground previous-planet" id="groundPlanet"></div>
        <div class="ship-container" id="shipContainer" aria-hidden="true">
          <div class="ship pixel-ship" id="ship"></div>
          <div class="engine-flame" id="engineFlame" aria-hidden="true"></div>
        </div>
        <div class="explosion" id="explosion" aria-hidden="true"></div>
      </div>
    </aside>

    <!-- Main area: cockpit (~80%) -->
    <main class="cockpit">
      <!-- Header above calculator: lives (left), level (center), score (right) -->
      <div class="cockpit-header">
        <div class="lives" aria-label="Lives">
          <div class="life-rocket life-rocket-full" id="flame1" data-life="1"></div>
          <div class="life-rocket life-rocket-full" id="flame2" data-life="2"></div>
          <div class="life-rocket life-rocket-full" id="flame3" data-life="3"></div>
        </div>
        <p class="level-display" id="levelDisplay" aria-live="polite">Level 1</p>
        <div class="score-wrap"><span class="score-label">Score</span> <span class="score-display" id="scoreDisplay" aria-live="polite">0</span></div>
      </div>
      <div class="cockpit-frame">
        <!-- Problem and answer display -->
        <div class="display-area">
          <p class="math-problem" id="mathProblem" aria-live="polite">7 + 5 =</p>
          <div class="answer-viewport is-empty" id="answerInputDisplay" aria-live="polite" aria-label="Your answer"></div>
        </div>

        <!-- Keypad: row1 = 1–5 + Del; row2 = 6–0 + Submit (six columns) -->
        <div class="keypad" id="keypad">
          <button type="button" class="keypad-btn num" data-digit="1">1</button>
          <button type="button" class="keypad-btn num" data-digit="2">2</button>
          <button type="button" class="keypad-btn num" data-digit="3">3</button>
          <button type="button" class="keypad-btn num" data-digit="4">4</button>
          <button type="button" class="keypad-btn num" data-digit="5">5</button>
          <button type="button" class="keypad-btn delete keypad-action-left" id="btnDelete" aria-label="Delete"></button>
          <button type="button" class="keypad-btn num" data-digit="6">6</button>
          <button type="button" class="keypad-btn num" data-digit="7">7</button>
          <button type="button" class="keypad-btn num" data-digit="8">8</button>
          <button type="button" class="keypad-btn num" data-digit="9">9</button>
          <button type="button" class="keypad-btn num" data-digit="0">0</button>
          <button type="button" class="keypad-btn submit keypad-action-right" id="btnSubmit" disabled>Submit</button>
        </div>
      </div>

      <!-- Feedback overlay: green check / red X -->
      <div class="feedback-overlay" id="feedbackOverlay" aria-hidden="true">
        <div class="feedback-check" id="feedbackCheck"></div>
        <div class="feedback-x" id="feedbackX"></div>
      </div>

      <!-- Game over overlay -->
      <div class="game-over-overlay hidden" id="gameOverOverlay">
        <p class="game-over-text" id="gameOverText">G A M E &nbsp;&nbsp; O V E R</p>
        <button type="button" class="play-again-btn" id="playAgainBtn">Play Again</button>
      </div>

      <!-- Level complete: full-width planet (top 1/5), rocket + dancing astronaut, Continue -->
      <div class="level-complete-overlay hidden" id="levelCompleteOverlay">
        <p class="level-complete-text">Great job! Advance to next planet!</p>
        <div class="level-complete-scene">
          <div class="level-complete-planet-wrap">
            <div class="level-complete-planet" id="levelCompletePlanet"></div>
          </div>
          <div class="level-complete-surface">
            <div class="level-complete-rocket"></div>
            <div class="astronaut-dancing" id="astronautDancing"></div>
          </div>
        </div>
        <button type="button" class="continue-btn" id="continueBtn">Continue</button>
      </div>

      <!-- Win overlay (game over only; level win uses level-complete) -->
      <div class="win-overlay hidden" id="winOverlay">
        <p class="win-text">You reached the planet!</p>
        <button type="button" class="play-again-btn" id="playAgainBtnWin">Play Again</button>
      </div>
    </main>

    <!-- Intro overlay: load tap, title, tap to play, launch stage, countdown -->
    <div class="intro-overlay" id="introOverlay">
      <div class="load-game-overlay" id="loadGameOverlay">
        <p>Tap to load game.</p>
      </div>
      <div class="intro-starfield" aria-hidden="true"></div>
      <div class="title-block" id="titleBlock">
        <h1 class="game-title" id="gameTitle">Planet Hopper</h1>
        <div class="click-to-start" id="clickToStart" aria-label="Tap to play">Tap to play.</div>
      </div>
      <!-- Launch stage: gantry (astronaut walks up it) then rocket, so the
           hull paints over the astronaut as they step aboard. -->
      <div class="intro-stage" id="introStage" aria-hidden="true">
        <div class="intro-ground" id="introGround" aria-hidden="true"></div>
        <div class="intro-gantry" id="introGantry"></div>
        <div class="intro-astronaut" id="astronaut"></div>
        <div class="intro-rocket" id="introRocket"></div>
      </div>
      <div class="countdown-overlay hidden" id="countdownOverlay">
        <span class="countdown-number" id="countdownNumber" data-step="3"></span>
      </div>
      <!-- Hold, not tap: a stray poke during the launch sequence used to blow
           past the whole intro. The ring is the only hit target and fills
           clockwise from 12 o'clock over the hold. -->
      <button class="intro-skip hidden" id="introSkip" type="button" aria-label="Hold to skip the intro">
        <svg class="intro-skip-ring" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
          <circle class="intro-skip-track" cx="50" cy="50" r="46"></circle>
          <circle class="intro-skip-fill" cx="50" cy="50" r="46"></circle>
        </svg>
        <span class="intro-skip-label">Hold<br>to<br>skip.</span>
      </button>
    </div>
  </div>

  <audio id="countdownSound" preload="none" playsinline>
    <source src="sounds/3 2 1 go_noise-removal_equalized_lower.mp3" type="audio/mpeg">
  </audio>
  <audio id="rocketLaunchSound" preload="none" playsinline>
    <source src="sounds/rocket_launch.wav" type="audio/wav">
  </audio>
  <!-- preload="metadata", not "none": playRocketSound() gates on
       isFinite(duration), so with "none" this optional engine bed would never
       play even if sounds/rocket.mp3 were added. -->
  <audio id="rocketSound" preload="metadata" playsinline>
    <source src="sounds/rocket.mp3" type="audio/mpeg">
  </audio>
  <audio id="levelCompleteSound" preload="none" playsinline>
    <source src="sounds/newthingget.mp3" type="audio/mpeg">
  </audio>
  <audio id="correctSound" preload="none" playsinline>
    <source src="sounds/Picked Coin Echo 2.mp3" type="audio/mpeg">
  </audio>
  <audio id="wrongSound" preload="none" playsinline>
    <source src="sounds/thunk.wav" type="audio/wav">
  </audio>
  <audio id="keypadClickSound" preload="none" playsinline>
    <source src="sounds/click_sound_6.mp3" type="audio/mpeg">
  </audio>

  <script src="game.js"></script>
  <script>
    (function () {
      if (!('serviceWorker' in navigator)) return;
      // Service workers require a secure context (HTTPS or localhost).
      if (!window.isSecureContext) return;
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (err) {
          console.warn('Service worker registration failed:', err);
        });
      });
    })();
  </script>
</body>
</html>
